coverage:
  round: up
  range: 50..100

  status:
    project:
      default:
        enabled: yes
        target: auto
        threshold: "5%"
        paths:
          - "src"
          - "include"
    patch:
      default:
        enabled: yes
        target: auto
        threshold: "5%"
        paths:
          - "src"
          - "include"